        const startBtn = document.getElementById('start-btn');
        const titleEl = document.getElementById('title');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        
        let img = new Image();
        let originalData;
        let width, height;
        let canvasArray;
        
        function rgbToHsv(r, g, b) {
            r /= 255; g /= 255; b /= 255;
            let max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h, s, v = max;
            let d = max - min;
            s = max === 0 ? 0 : d / max;
            if (max === min) { h = 0; } else {
                switch (max) {
                    case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                    case g: h = (b - r) / d + 2; break;
                    case b: h = (r - g) / d + 4; break;
                }
                h /= 6;
            }
            return [h, s, v];
        }

        function hsvToRgb(h, s, v) {
            let r, g, b;
            let i = Math.floor(h * 6);
            let f = h * 6 - i;
            let p = v * (1 - s);
            let q = v * (1 - f * s);
            let t = v * (1 - (1 - f) * s);
            switch (i % 6) {
                case 0: r = v, g = t, b = p; break;
                case 1: r = q, g = v, b = p; break;
                case 2: r = p, g = v, b = t; break;
                case 3: r = p, g = q, b = v; break;
                case 4: r = t, g = p, b = v; break;
                case 5: r = v, g = p, b = q; break;
            }
            return [Math.round(r * 255), Math.round(g * 255), Math.round(b * 255)];
        }

        img.onload = function() {
            if (!window.AYCA_DATA) {
                alert("Veri yüklenemedi. data.js dosyasının aynı klasörde olduğundan emin olun.");
                return;
            }
            
            // Veriden boyutları al (Orijinal boyut)
            width = window.AYCA_DATA.width;
            height = window.AYCA_DATA.height;
            
            canvas.width = width;
            canvas.height = height;
            
            // Resmi canvas'a bas ve pikselleri oku
            ctx.drawImage(img, 0, 0, width, height);
            originalData = ctx.getImageData(0, 0, width, height).data;
            
            // Tuvali beyaza boya
            canvasArray = new Uint8ClampedArray(width * height * 4);
            for(let i=0; i<canvasArray.length; i++) canvasArray[i] = 255; 
            
            ctx.fillStyle = "white";
            ctx.fillRect(0, 0, width, height);
            
            // Orijinaldeki "Eskiz fırça darbesinin boyutu" ve "Boyama fırça darbesi" 
            // hızlarına göre ayarlamak için ekrandaki pixel oranlarına göre UI scale
            // Ancak çizimi hep orijinal çözünürlükte yapacağız, CSS max-width ile ekrana sığacak
        };
        img.src = imageSrc;

        function getPix(idx) {
            return [originalData[idx*4], originalData[idx*4+1], originalData[idx*4+2]];
        }
        
        function putPixel(idx, r, g, b) {
            canvasArray[idx*4] = r;
            canvasArray[idx*4+1] = g;
            canvasArray[idx*4+2] = b;
            canvasArray[idx*4+3] = 255;
        }
        
        function getCanvasPixel(idx) {
            return [canvasArray[idx*4], canvasArray[idx*4+1], canvasArray[idx*4+2]];
        }
        
        function updateCanvas() {
            ctx.putImageData(new ImageData(canvasArray, width, height), 0, 0);
        }

        startBtn.addEventListener('click', () => {
            startBtn.style.display = "none";
            titleEl.style.display = "block";
            canvas.style.display = "block";
            startPhase1();
        });

        // --- FAZ 1: ESKİZ ---
        function startPhase1() {
            titleEl.innerText = "Faz 1: Resmin ana hatları (eskiz) çiziliyor...";
            let i = 0;
            let edgeCoords = window.AYCA_DATA.edges;
            // Orijinal Python: chunk_size_sketch = 500
            let chunkSize = 500;
            
            function loop() {
                for(let b=0; b<chunkSize && i<edgeCoords.length; b++, i++) {
                    let idx = edgeCoords[i];
                    putPixel(idx, 80, 80, 80);
                }
                updateCanvas();
                if(i < edgeCoords.length) {
                    requestAnimationFrame(loop); // plt.pause(0.01) simülasyonu
                } else {
                    titleEl.innerText = "Eskiz tamamlandı. Renklendirme başlıyor...";
                    setTimeout(startPhase2, 1000);
                }
            }
            loop();
        }

        // --- FAZ 2: RENKLENDİRME ---
        function startPhase2() {
            let passes = [
                {name: "1. Kat: Pastel Astar", sat: 0.5, alpha: 0.4},
                {name: "2. Kat: Renk İnşası", sat: 0.8, alpha: 0.7},
                {name: "3. Kat: Canlı Detaylar", sat: 1.0, alpha: 1.0}
            ];
            
            let passIndex = 0;
            let segmentOrder = [];
            let segmentIndex = 0;
            let pixelIndex = 0;
            let segments = window.AYCA_DATA.segments;
            let K = segments.length;

            function initPass() {
                if(passIndex >= passes.length) {
                    finish();
                    return;
                }
                titleEl.innerText = "Boyama Aşaması: " + passes[passIndex].name + "...";
                segmentOrder = Array.from({length: K}, (_, i) => i);
                segmentOrder.sort(() => Math.random() - 0.5); // random.shuffle(segment_order)
                segmentIndex = 0;
                pixelIndex = 0;
                paintLoop();
            }

            function paintLoop() {
                if(segmentIndex >= K) {
                    passIndex++;
                    initPass();
                    return;
                }
                
                let sId = segmentOrder[segmentIndex];
                let coords = segments[sId]; // Dizi halinde indexler
                
                if (coords.length === 0) {
                    segmentIndex++;
                    pixelIndex = 0;
                    paintLoop();
                    return;
                }
                
                // Orijinal Python: chunk_size_paint = max(50, len(x_coords) // 20)
                let chunkSize = Math.max(50, Math.floor(coords.length / 20));
                
                let passData = passes[passIndex];
                let drawnCount = 0;
                
                while(drawnCount < chunkSize && pixelIndex < coords.length) {
                    let idx = coords[pixelIndex];
                    pixelIndex++;
                    
                    let cp = getCanvasPixel(idx);
                    // Eskiz piksellerini (80,80,80) es geç (Python: non_sketch_mask)
                    if(cp[0] === 80 && cp[1] === 80 && cp[2] === 80) {
                        continue;
                    }
                    
                    let origColor = getPix(idx);
                    let hsv = rgbToHsv(origColor[0], origColor[1], origColor[2]);
                    
                    let newS = Math.min(Math.max(hsv[1] * passData.sat, 0), 1);
                    let targetColor = hsvToRgb(hsv[0], newS, hsv[2]);
                    
                    let a = passData.alpha;
                    let r = Math.round(targetColor[0]*a + cp[0]*(1-a));
                    let g = Math.round(targetColor[1]*a + cp[1]*(1-a));
                    let b = Math.round(targetColor[2]*a + cp[2]*(1-a));
                    
                    putPixel(idx, r, g, b);
                    drawnCount++;
                }
                
                updateCanvas();
                
                if(pixelIndex < coords.length) {
                    requestAnimationFrame(paintLoop);
                } else {
                    segmentIndex++;
                    pixelIndex = 0;
                    requestAnimationFrame(paintLoop);
                }
            }
            
            initPass();
        }

        function finish() {
            titleEl.innerText = "İşte Resminiz!";
            // unpainted_mask = (canvas_array == 255) -> orijinal resimle doldur
            for(let i=0; i<canvasArray.length; i+=4) {
                if(canvasArray[i]===255 && canvasArray[i+1]===255 && canvasArray[i+2]===255) {
                    canvasArray[i] = originalData[i];
                    canvasArray[i+1] = originalData[i+1];
                    canvasArray[i+2] = originalData[i+2];
                }
            }
            updateCanvas();
        }
